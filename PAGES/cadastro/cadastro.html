<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Frutas Cítricas</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Cadastro de Usuário</h1>

        <nav>
            <button><strong><a href="../../index.html">Voltar para Início</a></strong></button>
            <button><strong><a href="../login/login.html">Voltar para Login</a></strong></button>
        </nav>

    </header>

    <main>

        <section>
            <h2>Formulário de Cadastro</h2>

            <form>
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" name="nome" required>

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required>

                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" required>

                <label for="confirmarSenha">Confirmar Senha:</label>
                <input type="password" id="confirmarSenha" name="confirmarSenha" required>

                <label for="rg">RG:</label>
                <input type="text" id="rg" name="rg" required>

                <label for="cpf">CPF:</label>
                <input type="text" id="cpf" name="cpf" required>

                <label for="endereco">Endereço:</label>
                <input type="text" id="endereco" name="endereco" required>

                <label for="cep">CEP:</label>
                <input type="text" id="cep" name="cep" required>

                <label for="cidade">Cidade:</label>
                <input type="text" id="cidade" name="cidade" required>

                <label for="estado">Estado:</label>
                <input type="text" id="estado" name="estado" required>

                <label for="pais">País:</label>
                <input type="text" id="pais" name="pais" required>

                <label for="dataNascimento">Data de Nascimento:</label>
                <input type="date" id="dataNascimento" name="dataNascimento" required>

                <button type="submit">
                    Cadastrar
                </button>

                <button type="reset">
                    Limpar
                </button>

            </form>

            <p>
                Já possui cadastro?
                <button><strong><a href="../login/login.html">Voltar para Login</a></strong></button>
            </p>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 Frutas Cítricas - Todos os direitos reservados.</p>
    </footer>

</body>

</html>
